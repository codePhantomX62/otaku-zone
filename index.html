<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Otaku Zone v2.5 - Stable Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0a0a0c; --card: #14141b; --primary: #ff2e4d; --accent: #00f2ff; 
            --text: #f0f0f0; --nav-bg: rgba(18, 18, 24, 0.98);
            --success: #00d68f; --error: #ff6b6b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); 
            padding-bottom: 90px; overflow-x: hidden; font-size: 14px;
        }

        /* AUTH OVERLAY */
        #authOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 50000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { 
            background: var(--card); padding: 30px; border-radius: 25px; border: 1px solid #222; 
            width: 100%; max-width: 360px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .auth-card h2 { margin: 0 0 10px; color: var(--primary); text-align: center; letter-spacing: 2px; }
        .auth-input { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; 
            background: #000; color: white; outline: none; font-size: 14px;
        }
        .auth-btn { 
            width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: none; 
            background: var(--primary); color: white; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .guest-btn {
            background: transparent; color: #777; border: 1px solid #333; margin-top: 12px;
            width: 100%; padding: 10px; border-radius: 10px; font-size: 12px; cursor: pointer;
        }
        .divider { margin: 20px 0; border-top: 1px solid #222; position: relative; text-align: center; }
        .divider span { position: absolute; top: -10px; background: var(--card); padding: 0 10px; color: #555; font-size: 10px; left: 50%; transform: translateX(-50%); }
        .google-btn { 
            background: white; color: black; border: none; padding: 12px; border-radius: 10px; 
            width: 100%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px;
        }

        header { padding: 20px; text-align: center; font-weight: 900; color: var(--primary); letter-spacing: 5px; font-size: 1.4rem; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 15px; }
        .card { 
            background: var(--card); border-radius: 18px; overflow: hidden; position: relative; 
            height: 240px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; 
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.95)); padding: 12px 10px; }
        .card-info h4 { margin: 0; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .profile-section { text-align: center; padding: 30px 20px; }
        #displayPfp { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; background: #1a1a24; }
        
        .nav-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; background: var(--nav-bg); backdrop-filter: blur(20px); border-radius: 22px; padding: 8px 6px; display: flex; justify-content: space-around; border: 1px solid rgba(255,255,255,0.12); z-index: 10000; }
        .nav-item { color: #666; font-size: 10px; font-weight: 800; text-align: center; cursor: pointer; padding: 10px 8px; border-radius: 14px; }
        .nav-item.active { color: var(--primary); background: rgba(255, 46, 77, 0.15); }

        .section { display: none; }
        .section.active { display: block; }
        
        #detailOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 20000; display: none; overflow-y: auto; padding: 20px; }
        #detailOverlay.active { display: block; }
        .overlay-close { position: fixed; top: 20px; right: 20px; background: var(--primary); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; z-index: 100; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1a1a24; color: white; padding: 12px 20px; border-radius: 14px; border-left: 4px solid var(--success); z-index: 40000; transition: transform 0.3s ease; max-width: 90%; text-align: center; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-card">
        <h2>OTAKU ZONE</h2>
        <input type="email" id="email" class="auth-input" placeholder="Email Address">
        <input type="password" id="password" class="auth-input" placeholder="Password">
        <button class="auth-btn" onclick="emailLogin()">Sign In</button>
        <button class="guest-btn" onclick="signInLater()">Browse as Guest</button>
        <div class="divider"><span>OR CONTINUE WITH</span></div>
        <button class="google-btn" id="googleBtn" onclick="googleLogin()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" alt="G" width="20"> Google Account
        </button>
    </div>
</div>

<header>Otaku Zone</header>

<div id="home" class="section active">
    <div style="padding: 0 15px 15px;">
        <input id="searchInput" placeholder="🔍 Search Anime..." style="width: 100%; padding: 12px 16px; border-radius: 12px; background: var(--card); border: 1px solid #333; color: white;">
    </div>
    <div id="grid" class="grid"></div>
</div>

<div id="fav" class="section">
    <div class="profile-section">
        <img id="displayPfp" src="" alt="Profile">
        <h2 id="displayName">Guest User</h2>
        <button class="auth-btn" style="max-width: 200px;" onclick="logout()">LOGOUT / RESET</button>
    </div>
</div>

<div id="detailOverlay">
    <button class="overlay-close" onclick="closeOverlay()">✕</button>
    <img id="detImg" src="" style="width: 100%; height: 40vh; object-fit: cover; border-radius: 15px;">
    <h2 id="detTitle" style="padding: 15px; margin-bottom: 0;"></h2>
    <p id="detSyn" style="padding: 0 15px; color:#aaa; line-height: 1.6;"></p>
</div>

<div id="toast" class="toast"></div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="switchTab('home', this)">HOME</div>
    <div class="nav-item" onclick="switchTab('fav', this)">CORE</div>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
// YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyA-9lpQMIJA9Qq1W8s3jJHswQcU2C4xA8E",
  authDomain: "otaku-zone-aut.firebaseapp.com",
  projectId: "otaku-zone-aut",
  storageBucket: "otaku-zone-aut.firebasestorage.app",
  messagingSenderId: "55377515369",
  appId: "1:55377515369:web:634be1b3360e067f3a23f8"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
let isGuest = false;

// 1. GOOGLE LOGIN (REDIRECT)
function googleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithRedirect(provider);
}

// 2. CHECK REDIRECT RESULT ON PAGE LOAD
auth.getRedirectResult().then((result) => {
    if (result.user) {
        showToast("Logged in via Google! ✨");
    }
}).catch((error) => {
    if (error.code !== 'auth/no-auth-event') {
        showToast("Error: " + error.message);
    }
});

// 3. LISTEN FOR USER CHANGES
auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('displayName').textContent = user.displayName || user.email;
        document.getElementById('displayPfp').src = user.photoURL || "https://ui-avatars.com/api/?name=User";
        init();
    } else if (!isGuest) {
        document.getElementById('authOverlay').style.display = 'flex';
    }
});

function signInLater() {
    isGuest = true;
    document.getElementById('authOverlay').style.display = 'none';
    init();
}

async function init() {
    try {
        const response = await fetch(`https://api.jikan.moe/v4/top/anime?limit=14`);
        const json = await response.json();
        render('grid', json.data);
    } catch (e) {
        showToast("Failed to load anime data.");
    }
}

function render(containerId, list) {
    const container = document.getElementById(containerId);
    container.innerHTML = list.map(a => `
        <div class="card" onclick="openDet(${a.mal_id})">
            <img src="${a.images.jpg.image_url}">
            <div class="card-info"><h4>${a.title}</h4></div>
        </div>
    `).join('');
}

window.openDet = async (id) => {
    const r = await fetch(`https://api.jikan.moe/v4/anime/${id}`);
    const json = await r.json();
    const a = json.data;
    document.getElementById('detImg').src = a.images.jpg.large_image_url;
    document.getElementById('detTitle').textContent = a.title;
    document.getElementById('detSyn').textContent = a.synopsis || "No summary available.";
    document.getElementById('detailOverlay').classList.add('active');
};

window.closeOverlay = () => document.getElementById('detailOverlay').classList.remove('active');
window.logout = () => auth.signOut().then(() => location.reload());

window.showToast = (m) => {
    const t = document.getElementById('toast');
    t.textContent = m;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
};

function switchTab(id, el) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
}
</script>
</body>
</html>
